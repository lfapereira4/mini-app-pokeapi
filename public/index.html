<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rick and Morty Dex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Requisito 1: interface organizada com HTML e CSS -->
  <!-- Visual inspirado numa Pokédex (moldura vermelha + "lente"),
       mas os dados continuam sendo da Rick and Morty API -->
  <header>
    <h1>Rick and Morty Dex</h1>
    <p>Digite o nome (ou número) de um personagem e consulte a API</p>
  </header>

  <main>
    <!-- Requisito 2: campo de entrada que participa da consulta -->
    <!-- Requisito 3: interação por meio de evento do DOM (submit do formulário) -->
    <form id="form-busca">
      <input
        type="text"
        id="input-personagem"
        placeholder="Ex: rick, morty, 1..."
        required
      >
      <button type="submit">Buscar</button>
    </form>

    <!-- Requisito 9: feedback visual enquanto a consulta acontece -->
    <p id="mensagem-status"></p>

    <!-- Requisito 10: resultado aparece na própria página (não só no console) -->
    <section id="resultado" class="escondido">
      <img id="personagem-imagem" src="" alt="Imagem do personagem">
      <h2 id="personagem-nome"></h2>

      <!-- Extra decorativo: só aparece pros IDs 1-10 (som de Pokémon) -->
      <button type="button" id="botao-som" class="escondido">🔊 Ouvir</button>

      <ul class="info">
        <li><strong>Número:</strong> <span id="personagem-numero"></span></li>
        <li><strong>Espécie:</strong> <span id="personagem-especie"></span></li>
        <li><strong>Status:</strong> <span id="personagem-status"></span></li>
        <li><strong>Gênero:</strong> <span id="personagem-genero"></span></li>
        <li><strong>Origem:</strong> <span id="personagem-origem"></span></li>
      </ul>
    </section>
  </main>

  <!-- O script fica no fim do body para garantir que o HTML já existe
       quando o JavaScript tenta selecionar os elementos -->
  <script src="script.js"></script>
</body>
</html>
